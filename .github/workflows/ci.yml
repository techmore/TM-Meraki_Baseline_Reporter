name: CI

on:
  push:
    branches: [main, Meraki-Security-Baseline]
  pull_request:
    branches: [main, Meraki-Security-Baseline]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Smoke imports
        run: |
          python - <<'PY'
          import meraki_backup
          import meraki_env
          import meraki_query
          from reporting.app import build_org_report
          print("smoke imports ok")
          PY

      - name: Run tests
        run: python -m pytest tests/ --tb=short

      - name: CLI help text renders
        run: |
          python -m reporting --help
          python meraki_backup.py --help
          python meraki_query.py --help
          python meraki_env.py --help
          python -m reporting.health --help

      - name: Fixture report smoke test (no Meraki credentials)
        run: |
          python -m reporting --source-dir tests/fixtures --org-name "CI Fixture Org" --output-dir "$RUNNER_TEMP/report"
          test -s "$RUNNER_TEMP/report/CI_Fixture_Org_Complete_Report_$(date +%F).html"

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pip-audit (advisory)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --progress-spinner off
