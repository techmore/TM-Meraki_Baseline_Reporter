name: CI

on:
  push:
    branches: [main, Meraki-Security-Baseline]
  pull_request:
    branches: [main, Meraki-Security-Baseline]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Lint (syntax check)
        run: |
          python -m py_compile meraki_backup.py
          python -m py_compile report_generator.py
          python -m py_compile meraki_env.py
          python -m py_compile meraki_query.py
          for f in reporting/*.py; do python -m py_compile "$f"; done

      - name: Smoke imports
        run: |
          python - <<'PY'
          import meraki_backup
          import meraki_env
          import meraki_query
          from reporting.app import build_org_report
          print("smoke imports ok")
          PY

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
